<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2A Milk Tea - Trải Nghiệm Đặt Món Hiện Đại</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- ĐỊNH NGHĨA BIẾN MÀU SẮC & THƯƠNG HIỆU --- */
        :root {
            --mau-chu-dao: #86b38f; /* Xanh rêu trà sữa nhạt */
            --mau-chu-dao-hover: #6e9a77;
            --mau-nen-kem: #fefce7; /* Vàng kem ấm áp */
            --mau-nen-phu: #f5f5ee; /* Màu kem nhạt cho card */
            --mau-chu-dam: #333f35; /* Màu chữ xám rêu đậm */
            --mau-chu-nhat: #7c887e;
            --mau-accent: #ff7675; /* Màu cam đỏ cho giá/nút hủy */
            --bo-goc: 16px;
            --bo-goc-sm: 8px;
            --font-chuan: 'Plus Jakarta Sans', sans-serif;
            --shadow-nhe: 0 8px 24px rgba(134, 179, 143, 0.08);
            --shadow-dam: 0 12px 32px rgba(51, 63, 53, 0.12);
        }

        /* --- STYLE NỀN TẢNG --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-chuan);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--mau-nen-kem);
            color: var(--mau-chu-dam);
            min-height: 100vh;
            padding-bottom: 80px; /* Tránh đè dữ liệu bởi giỏ hàng dưới Mobile */
        }

        /* --- STICKY HEADER --- */
        header {
            position: sticky;
            top: 0;
            background: rgba(254, 252, 231, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(51, 63, 53, 0.04);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand-logo h2 {
            font-size: 20px;
            color: var(--mau-chu-dao-hover);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar-container {
            flex: 1;
            max-width: 450px;
            position: relative;
        }

            .search-bar-container input {
                width: 100%;
                padding: 10px 16px;
                padding-left: 40px;
                border-radius: 20px;
                border: 1px solid rgba(134, 179, 143, 0.3);
                background: #fff;
                font-size: 14px;
                outline: none;
                transition: all 0.3s;
            }

                .search-bar-container input:focus {
                    border-color: var(--mau-chu-dao);
                    box-shadow: 0 0 0 3px rgba(134, 179, 143, 0.15);
                }

            .search-bar-container::before {
                content: "🔍";
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 14px;
                opacity: 0.6;
            }

        .table-badge-input {
            width: 90px;
            padding: 8px;
            border-radius: var(--bo-goc);
            border: 2px solid var(--mau-chu-dao);
            background: #fff;
            text-align: center;
            font-weight: bold;
            color: var(--mau-chu-dao-hover);
        }

        /* --- KHUNG LAYOUT CHÍNH (FLEXBOX / GRID RESPONSIVE) --- */
        .main-layout {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 32px;
        }

        /* --- DANH SÁCH MÓN DẠNG CARD MẠNG LƯỚI --- */
        .menu-section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            position: relative;
            padding-left: 12px;
        }

            .menu-section-title::before {
                content: "";
                position: absolute;
                left: 0;
                top: 4px;
                bottom: 4px;
                width: 4px;
                background: var(--mau-chu-dao);
                border-radius: 2px;
            }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border-radius: var(--bo-goc);
            overflow: hidden;
            box-shadow: var(--shadow-nhe);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

            .product-card:hover {
                transform: translateY(-6px);
                box-shadow: var(--shadow-dam);
            }

        .product-img-wrapper {
            width: 100%;
            padding-top: 100%; /* Tạo tỷ lệ vuông chuẩn ảnh 1:1 */
            position: relative;
            background-color: var(--mau-nen-phu);
        }

            .product-img-wrapper img {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.5s ease;
            }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.06);
        }

        .product-detail {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.4;
            height: 42px; /* Cố định chiều cao tránh lệch card */
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--mau-accent);
            margin-bottom: 12px;
        }

        .card-action-row {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .size-selector-row {
            display: flex;
            gap: 6px;
        }

        .size-tag-btn {
            flex: 1;
            padding: 6px 0;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(134, 179, 143, 0.3);
            background: #fff;
            color: var(--mau-chu-nhat);
            border-radius: var(--bo-goc-sm);
            cursor: pointer;
            transition: all 0.2s;
        }

            .size-tag-btn.active {
                background: var(--mau-chu-dao);
                color: #fff;
                border-color: var(--mau-chu-dao);
            }

        .add-to-cart-btn {
            width: 100%;
            padding: 10px 0;
            background: var(--mau-chu-dao);
            color: #fff;
            border: none;
            border-radius: var(--bo-goc-sm);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

            .add-to-cart-btn:hover {
                background: var(--mau-chu-dao-hover);
            }

        /* --- KHUNG GIỎ HÀNG SIDEBAR (PC) & FIXED FOOTER (MOBILE) --- */
        .cart-sidebar-wrapper {
            position: sticky;
            top: 90px;
            height: calc(100vh - 120px);
        }

        .cart-card-container {
            background: #fff;
            border-radius: var(--bo-goc);
            padding: 24px;
            box-shadow: var(--shadow-dam);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

            .cart-card-container h3 {
                font-size: 16px;
                font-weight: 700;
                padding-bottom: 14px;
                border-bottom: 1px solid var(--mau-nen-phu);
                margin-bottom: 14px;
            }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--mau-nen-phu);
            animation: slideIn 0.2s ease;
        }

        .cart-item-info h5 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .cart-item-size {
            font-size: 11px;
            background: var(--mau-nen-phu);
            color: var(--mau-chu-nhat);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Cụm nút tăng giảm tinh gọn chuẩn App */
        .modern-qty-control {
            display: flex;
            align-items: center;
            background: var(--mau-nen-phu);
            border-radius: 20px;
            padding: 2px;
            margin-top: 6px;
            width: fit-content;
        }

            .modern-qty-control button {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: none;
                background: #fff;
                font-weight: bold;
                cursor: pointer;
                transition: background 0.2s;
            }

                .modern-qty-control button:hover {
                    background: var(--mau-chu-dao);
                    color: #fff;
                }

            .modern-qty-control span {
                padding: 0 10px;
                font-size: 13px;
                font-weight: 600;
            }

        .cart-item-right {
            text-align: right;
        }

        .cart-item-price {
            font-size: 14px;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        .cart-item-delete {
            font-size: 12px;
            color: var(--mau-accent);
            cursor: pointer;
            opacity: 0.7;
        }

            .cart-item-delete:hover {
                opacity: 1;
            }

        .cart-summary-block {
            padding-top: 16px;
            border-top: 1px solid var(--mau-nen-phu);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .checkout-submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--mau-chu-dao-hover);
            color: #fff;
            border: none;
            border-radius: var(--bo-goc);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(110, 154, 119, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

            .checkout-submit-btn:active {
                transform: scale(0.98);
            }

        /* --- FLOATING MOBILE CART BAR (BẬT KHI LÊN ĐIỆN THOẠI) --- */
        .mobile-cart-bar {
            display: none;
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: var(--mau-chu-dam);
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-dam);
            z-index: 99;
            cursor: pointer;
            animation: bounceIn 0.4s ease;
        }

        .mobile-cart-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-cart-badge {
            background: var(--mau-chu-dao);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- POPUP MODAL XÁC NHẬN CHUẨN APP TỐI GIẢN --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(51, 63, 53, 0.4);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

            .modal-overlay.open {
                opacity: 1;
                pointer-events: auto;
            }

        .modal-body {
            background: #fff;
            border-radius: var(--bo-goc);
            padding: 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: var(--shadow-dam);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.open .modal-body {
            transform: translateY(0);
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .modal-body h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-body p {
            font-size: 14px;
            color: var(--mau-chu-nhat);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--bo-goc-sm);
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

            .modal-btn.confirm {
                background: var(--mau-chu-dao);
                color: #fff;
            }

            .modal-btn.cancel {
                background: var(--mau-nen-phu);
                color: var(--mau-chu-dam);
            }

        /* --- ANIMATIONS CHẤT LƯỢNG CAO --- */
        @keyframes slideIn {
            from {
                transform: translateX(10px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            70% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ======================================================= */
        /* --- MEDIA QUERY ĐÁP ỨNG RESPONSIVE CHUẨN (PC/TABLET/MOBILE) --- */
        /* ======================================================= */

        /* 1. Màn hình Tablet & Thiết bị nhỏ hơn (Dưới 992px) */
        @media (max-width: 992px) {
            .main-layout {
                grid-template-columns: 1fr; /* Gộp giỏ hàng phụ thành 1 cột */
                gap: 16px;
            }

            .cart-sidebar-wrapper {
                display: none; /* Ẩn sidebar giỏ hàng cố định */
            }

            /* Hiện thanh giỏ hàng thông minh dưới Mobile */
            .mobile-cart-bar.active {
                display: flex;
            }
        }

        /* 2. Màn hình Mobile (Dưới 576px) */
        @media (max-width: 576px) {
            header {
                padding: 12px;
            }

            .brand-logo h2 {
                font-size: 18px;
            }

            .search-bar-container {
                max-width: 180px;
            }

            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); /* Card thu nhỏ dạng 2 cột mỗi hàng rất gọn */
                gap: 12px;
            }

            .product-card {
                border-radius: 12px;
            }

            .product-detail {
                padding: 10px;
            }

            .product-title {
                font-size: 13px;
                height: 36px;
                margin-bottom: 4px;
            }

            .product-price {
                font-size: 14px;
                margin-bottom: 8px;
            }

            .add-to-cart-btn {
                padding: 8px 0;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-container">
            <div class="brand-logo">
                <h2>🍹 Q2A MILK TEA</h2>
            </div>

            <div class="search-bar-container">
                <input type="text" id="txtSearch" placeholder="Tìm trà sữa, topping..." oninput="filterMenu()">
            </div>

            <div>
                <input id="ban" class="table-badge-input" type="number" placeholder="Bàn" readonly>
            </div>
        </div>
    </header>

    <main class="main-layout">

        <section>
            <h3 class="menu-section-title">Menu Thức Uống</h3>
            <div id="menu" class="menu-grid">
            </div>
        </section>

        <aside class="cart-sidebar-wrapper">
            <div class="cart-card-container">
                <h3>🛒 Giỏ hàng của bạn</h3>
                <div id="cartItems" class="cart-items-list">Chưa có món nào được chọn</div>

                <div class="cart-summary-block">
                    <div class="summary-row">
                        <span>Tổng cộng:</span>
                        <span id="total">0 đ</span>
                    </div>
                    <button class="checkout-submit-btn" onclick="openConfirmModal()">Đặt món ngay</button>
                </div>
            </div>
        </aside>

    </main>

    <div class="mobile-cart-bar" id="mobileCartBar" onclick="scrollToCartOrCheckout()">
        <div class="mobile-cart-left">
            <div class="mobile-cart-badge" id="mobileCartCount">0</div>
            <span>Xem giỏ hàng</span>
        </div>
        <span id="mobileCartTotal" style="font-weight: 700;">0 đ</span>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-body">
            <div class="modal-icon">🔔</div>
            <h4>Gửi đơn vào bếp?</h4>
            <p>Vui lòng kiểm tra lại kỹ danh sách món ăn và số bàn trước khi xác nhận gửi đơn đặt hàng.</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeConfirmModal()">Kiểm tra lại</button>
                <button class="modal-btn confirm" onclick="submitOrderBackend()">Gửi ngay</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://clicker-unnamable-boney.ngrok-free.app";
        let originalMenuData = []; // Lưu trữ dữ liệu gốc để tìm kiếm filter
        let cart = [];

        // Đồng bộ số bàn từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const maBanFromURL = urlParams.get("ban");
        if (maBanFromURL) {
            document.getElementById("ban").value = maBanFromURL;
        } else {
            document.getElementById("ban").removeAttribute("readonly");
        }

        // Tải Menu từ API khi chạy ứng dụng
        initMenu();

        async function initMenu() {
            try {
                // Giả lập dữ liệu mẫu nếu API chưa kịp phản hồi để test UI lập tức
                originalMenuData = [
                    { maMon: 1, tensanpham: "Trà Sữa Việt Quất Đá Xay", dongia: 45000 },
                    { maMon: 2, tensanpham: "Trà Cam Nha Đam", dongia: 50000 },
                    { maMon: 3, tensanpham: "Trà Sữa Ô Long Matcha", dongia: 42000 },
                    { maMon: 4, tensanpham: "Nước Ép Dâu Tây", dongia: 48000 }
                ];

                // Fetch thực tế
                const res = await fetch(`${API_BASE}/api/menu`);
                if (res.ok) {
                    originalMenuData = await res.json();
                }
            } catch (e) {
                console.log("Sử dụng fallback dữ liệu mẫu để render UI.");
            } finally {
                renderMenu(originalMenuData);
            }
        }

        // Tạo Card món ăn đồng đều chuẩn Katinat/Gong Cha
        function renderMenu(data) {
            const menuContainer = document.getElementById("menu");
            menuContainer.innerHTML = "";

            // Hàm loại bỏ dấu tiếng Việt để so sánh chuỗi chính xác tuyệt đối
            const xoaDauTiengViet = (str) => {
                return str.normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/đ/g, "d")
                    .replace(/Đ/g, "d");
            };

            data.forEach((item, index) => {
                const sizeGroupId = `size-container-${index}`;
                const card = document.createElement("div");
                card.className = "product-card";

                // 1. Đặt một ảnh mặc định (Dùng matcha làm nền cơ bản nếu không khớp món nào)
                let anhSanPham = `${API_BASE}/images/matcha.jpg`;

                // Chuyển đổi tên sản phẩm về dạng chữ thường và sạch dấu tiếng Việt
                const tenMonGoc = item.tensanpham.toLowerCase();
                const tenMonKhongDau = xoaDauTiengViet(tenMonGoc);

                // 2. Kiểm tra từ khóa tối ưu để gán đúng file ảnh từ server
                if (tenMonKhongDau.includes("viet quat") || tenMonKhongDau.includes("vietquat")) {
                    anhSanPham = `${API_BASE}/images/vietquat.jpg`;
                } else if (tenMonKhongDau.includes("vai thieu") || tenMonKhongDau.includes("vai")) {
                    anhSanPham = `${API_BASE}/images/vai thieu.jpg`;
                } else if (tenMonKhongDau.includes("chery")) {
                    anhSanPham = `${API_BASE}/images/cherry.png`;
                } else if (tenMonKhongDau.includes("dau")) {
                    anhSanPham = `${API_BASE}/images/dau.jpg`;
                } else if (tenMonKhongDau.includes("matcha") || tenMonKhongDau.includes("tra xan")) {
                    anhSanPham = `${API_BASE}/images/matcha.jpg`;
                } else if (tenMonKhongDau.includes("cam")) {
                    anhSanPham = `${API_BASE}/images/cam.png`;
                } else if (tenMonKhongDau.includes("ca phe sua da")) {
                    anhSanPham = `${API_BASE}/images/caphesuada.jpg`;
                } else if (tenMonKhongDau.includes("ca phe den")) {
                    anhSanPham = `${API_BASE}/images/capheden.jpg`;
                }

                // 3. Đổ dữ liệu vào giao diện Card HTML kèm biến anhSanPham mới
                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img src="${anhSanPham}" alt="${item.tensanpham}">
                    </div>
                    <div class="product-detail">
                        <h4 class="product-title">${item.tensanpham}</h4>
                        <p class="product-price">${item.dongia.toLocaleString()} đ</p>

                        <div class="card-action-row">
                            <div class="size-selector-row" id="${sizeGroupId}">
                                <button class="size-tag-btn active" onclick="selectSizeTag('${sizeGroupId}', 'M')">Size M</button>
                                <button class="size-tag-btn" onclick="selectSizeTag('${sizeGroupId}', 'L')">Size L</button>
                            </div>
                            <button class="add-to-cart-btn" onclick="triggerAddToCart(${item.maMon}, '${item.tensanpham}', ${item.dongia}, '${sizeGroupId}')">
                                + Thêm vào giỏ
                            </button>
                        </div>
                    </div>
                `;
                menuContainer.appendChild(card);
            });
        }

        // Tìm kiếm thời gian thực (Real-time Filter)
        function filterMenu() {
            const keyword = document.getElementById("txtSearch").value.toLowerCase().trim();
            const filtered = originalMenuData.filter(i => i.tensanpham.toLowerCase().includes(keyword));
            renderMenu(filtered);
        }

        function selectSizeTag(groupId, size) {
            const container = document.getElementById(groupId);
            const buttons = container.querySelectorAll(".size-tag-btn");
            buttons.forEach(btn => {
                btn.classList.remove("active");
                if (btn.innerText.includes(size)) btn.classList.add("active");
            });
        }

        function triggerAddToCart(maMon, name, price, groupId) {
            const container = document.getElementById(groupId);
            const activeBtn = container.querySelector(".size-tag-btn.active");
            const selectedSize = activeBtn.innerText.includes("L") ? "L" : "M";

            const existing = cart.find(i => i.name === name && i.size === selectedSize);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ maMon, name, price, size: selectedSize, qty: 1 });
            }
            renderCart();
        }

        // Render Giỏ hàng hỗ trợ Tăng/Giảm/Xóa
        function renderCart() {
            const listContainer = document.getElementById("cartItems");
            const totalPc = document.getElementById("total");
            const mobileBar = document.getElementById("mobileCartBar");
            const mobileCount = document.getElementById("mobileCartCount");
            const mobileTotal = document.getElementById("mobileCartTotal");

            if (cart.length === 0) {
                listContainer.innerHTML = "Chưa có món nào được chọn";
                totalPc.innerHTML = "0 đ";
                mobileBar.classList.remove("active");
                return;
            }

            let totalMoney = 0;
            let totalQty = 0;
            listContainer.innerHTML = "";

            cart.forEach((item, index) => {
                totalMoney += item.price * item.qty;
                totalQty += item.qty;

                const row = document.createElement("div");
                row.className = "cart-item-row";
                row.innerHTML = `
                            <div class="cart-item-info">
                                <h5>${item.name}</h5>
                                <span class="cart-item-size">Size ${item.size}</span>
                                <div class="modern-qty-control">
                                    <button onclick="updateQuantity(${index}, -1)">-</button>
                                    <span>${item.qty}</span>
                                    <button onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                            </div>
                            <div class="cart-item-right">
                                <span class="cart-item-price">${(item.price * item.qty).toLocaleString()} đ</span>
                                <span class="cart-item-delete" onclick="deleteItem(${index})">Xóa</span>
                            </div>
                        `;
                listContainer.appendChild(row);
            });

            // Cập nhật lên UI PC
            totalPc.innerHTML = `${totalMoney.toLocaleString()} đ`;

            // Cập nhật và kích hoạt Floating Cart dưới Mobile
            mobileCount.innerHTML = totalQty;
            mobileTotal.innerHTML = `${totalMoney.toLocaleString()} đ`;
            mobileBar.classList.add("active");
        }

        function updateQuantity(index, offset) {
            cart[index].qty += offset;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            renderCart();
        }

        function deleteItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        /* --- XỬ LÝ ĐIỀU HƯỚNG/MODAL XÁC NHẬN --- */
        function openConfirmModal() {
            const banVal = document.getElementById("ban").value;
            if (!banVal) return alert("Vui lòng nhập số bàn ăn của bạn!");
            if (cart.length === 0) return alert("Giỏ hàng của bạn đang trống!");
            document.getElementById("confirmModal").classList.add("open");
        }

        function closeConfirmModal() {
            document.getElementById("confirmModal").classList.remove("open");
        }

        function scrollToCartOrCheckout() {
            // Trên mobile, khi click vào floating bar sẽ kích hoạt gọi mở popup luôn
            openConfirmModal();
        }

        // Gửi Đơn Hàng Lên Hệ Thống Backend
        async function submitOrderBackend() {
            closeConfirmModal();
            const banVal = document.getElementById("ban").value;

            const orderPayload = {
                maBan: parseInt(banVal),
                trangThai: "Mới",
                chiTiet: cart.map(item => ({
                    maMon: item.maMon,
                    tenSP: item.name,
                    soLuong: parseInt(item.qty),
                    gia: parseFloat(item.price),
                    size: item.size
                }))
            };

            try {
                const res = await fetch(`${API_BASE}/api/donhang`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(orderPayload)
                });

                if (res.ok) {
                    alert("🎉 Đơn hàng đã được gửi vào bếp thành công!");
                    cart = [];
                    renderCart();
                } else {
                    alert("Gặp lỗi khi xử lý gửi đơn!");
                }
            } catch (err) {
                alert("Không kết nối được tới máy chủ TraSua_API!");
            }
        }
    </script>
</body>
